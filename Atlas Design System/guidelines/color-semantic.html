<!-- @dsCard group="Colors" viewport="700x170" name="Money & status" subtitle="Positive, negative, warning, info — derived, not sampled" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-text)}.wrap{padding:24px 28px}.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="wrap" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--positive-500)"></div><div style="height:36px;border-radius:var(--radius-sm);background:var(--positive-100);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--positive-600,#8a5b12)">+288.00</div><span class="lbl">Positive</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--negative-500)"></div><div style="height:36px;border-radius:var(--radius-sm);background:var(--negative-100);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--negative-600,#8a5b12)">Declined</div><span class="lbl">Negative</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--warning-500)"></div><div style="height:36px;border-radius:var(--radius-sm);background:var(--warning-100);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--warning-600,#8a5b12)">Pending</div><span class="lbl">Warning</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--info-500)"></div><div style="height:36px;border-radius:var(--radius-sm);background:var(--info-100);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--info-600,#8a5b12)">Verified</div><span class="lbl">Info</span></div>
</div></body></html>
