<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-text)}.wrap{padding:24px 28px}.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="wrap" style="display:flex;gap:22px;background:var(--cream-100);padding:32px 28px"><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:78px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)"></div><span class="mono">xs</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:78px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><span class="mono">sm</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:78px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><span class="mono">md</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:78px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><span class="mono">lg</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:78px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-float)"></div><span class="mono">float</span></div></div></body></html>
