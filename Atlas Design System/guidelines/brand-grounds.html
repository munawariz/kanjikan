<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-text)}.wrap{padding:24px 28px}.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="wrap" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div><div style="background:var(--cream-100);border-radius:var(--radius-card-lg);height:112px;"></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="lbl">Cream</span><span class="mono">flat</span></div></div><div><div style="background:var(--sage-100);border-radius:var(--radius-card-lg);height:112px;"></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="lbl">Sage</span><span class="mono">flat</span></div></div><div><div style="background:#fff;border-radius:var(--radius-card-lg);height:112px;box-shadow:var(--shadow-md)"></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="lbl">White</span><span class="mono">shadow-md</span></div></div><div><div style="background:var(--forest-800);border-radius:var(--radius-card-lg);height:112px;"></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="lbl">Forest</span><span class="mono">flat</span></div></div>
</div></body></html>
