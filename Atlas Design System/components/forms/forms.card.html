<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Atlas — Forms</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-text)}#root{padding:24px 28px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);font-weight:600}</style></head><body><div id="root"></div><script type="text/babel">
const { Field, Input, Select, Checkbox, Radio, Switch, AmountField } = window.AtlasDesignSystem_92c2f4;
function Demo(){
  const [chk,setChk]=React.useState(true), [on,setOn]=React.useState(true), [r,setR]=React.useState("std");
  return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
    <div className="col">
      <Field label="Recipient email" hint="They are notified instantly.">
        <Input placeholder="name@bank.com" icon="search" />
      </Field>
      <Field label="Country" >
        <Select options={[{value:"us",label:"United States"},{value:"bd",label:"Bangladesh"}]} />
      </Field>
      <Field label="Sort code" error="Enter six digits.">
        <Input defaultValue="20-11" invalid />
      </Field>
    </div>
    <div className="col">
      <AmountField label="Amount to send" value="100" currency="USD" />
      <AmountField label="Recipient will get" value="10,750" currency="BDT" readOnly />
      <Checkbox checked={chk} onChange={()=>setChk(!chk)} label="Save this recipient" description="Appears in your quick-send list." />
      <div className="row" style={{gap:22}}>
        <Radio name="s" label="Standard — free" checked={r==="std"} onChange={()=>setR("std")} />
        <Radio name="s" label="Express — $2" checked={r==="exp"} onChange={()=>setR("exp")} />
      </div>
      <Switch checked={on} onChange={setOn} label="Round up my spare change" />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);</script></body></html>
