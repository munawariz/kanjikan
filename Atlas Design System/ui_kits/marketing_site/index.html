<script type="text/babel">
const { Navbar, Marquee, SiteFooter } = window.AtlasDesignSystem_92c2f4;
window.atlasGoTo = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 40, behavior: "smooth" }); };
const SECTIONS = ["features","borders","steps","faster","proof","download"];
function Site(){
  const [active,setActive]=React.useState(0);
  const go=(i)=>{ setActive(i); window.atlasGoTo(SECTIONS[Math.min(i,SECTIONS.length-1)]); };
  return (<>
    <Navbar links={["Features","Credit","Debit","App","Contact"]} activeIndex={active} onNavigate={(l,i)=>go(i)} onCta={()=>window.atlasGoTo("download")} />
    <window.Hero />
    <Marquee items={["Instant Online Debit","Digital Banking","Cash Back & Perks","Fee-Free Transfers"]} />
    <window.FeaturesSection />
    <window.BordersSection />
    <window.StepsSection />
    <Marquee items={["Instant Online Debit","Digital Banking","Cash Back & Perks","Fee-Free Transfers"]} speed={38} />
    <window.FasterSection />
    <window.ProofSection />
    <window.DownloadSection />
    <SiteFooter columns={[
      {title:"Product",links:["Debit card","Credit card","Mobile app","Transfers"]},
      {title:"Company",links:["About","Careers","Press","Blog"]},
      {title:"Support",links:["Help centre","Contact","Status","Fees"]}]} />
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);
</script></body></html>
